<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- ⚠ Pointait sur /gemini.png, un fichier qui N'EXISTE PAS dans public/ :
         l'onglet n'avait donc aucune icône, et le navigateur redemandait un
         404 à chaque visite. Le SVG reste en premier pour les navigateurs qui
         le préfèrent (net à toute taille) ; les PNG servent de repli. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- La teinte de l'interface du navigateur. Elle doit être celle de la
         barre du site (--surface-chrome), sinon un liseré d'une autre couleur
         se voit au-dessus de l'en-tête. Le manifeste porte la même valeur —
         il annonçait le doré de l'admin Django, celle-ci l'indigo profond :
         trois valeurs pour une seule barre. -->
    <meta name="theme-color" content="#161B2D" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- « black-translucent » fait passer la page SOUS la barre d'état de
         l'iPhone, ce qui demande viewport-fit=cover et une réserve
         safe-area-inset-top sur la barre de navigation — ni l'un ni l'autre
         n'existaient, donc l'heure et la batterie se posaient sur le nom de
         la maison une fois le site installé. « black » réserve la barre :
         fond noir, texte clair, au plus près de l'indigo du site. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Golden Pousso" />
    <!-- ⚠ iOS NE LIT PAS le SVG pour apple-touch-icon, et ignore le manifeste
         pour l'icône d'accueil : sans ce PNG, l'iPhone posait une capture
         d'écran de la page à la place du logo. 180 px, le format attendu. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />

    <!-- ══ Polices ══════════════════════════════════════════════════════════
         Chargées ici et NON via @import dans styles.css : un @import oblige le
         navigateur à télécharger la feuille avant même de découvrir l'URL des
         polices — un aller-retour réseau complet ajouté au chemin critique.
         Sur une 3G sénégalaise, c'est plusieurs centaines de ms de page nue.

         Le preconnect ouvre la connexion TLS vers fonts.gstatic.com en
         parallèle du parsing HTML. crossorigin est obligatoire sur la seconde
         ligne : les fichiers de police sont servis en CORS, sans cet attribut
         la connexion préouverte n'est pas réutilisée.

         Fraunces = marque et voix éditoriale · Inter = information.

         Fraunces est demandée en variable sur trois axes :
           opsz 9..144  la lettre se redessine selon la taille de rendu ;
                        c'est ce qui la rend lisible à 15 px comme à 96 px.
           wght 300..900 remplace les quatre graisses statiques de l'ancienne
                        Syne par un seul fichier — et rend enfin valides les
                        `fontWeight: 400` qui étaient demandés sans être
                        chargés.
           WONK 0..1    substitue les formes volontairement irrégulières
                        (inclinaison des h/n/m, terminaisons en goutte des
                        b/d/k/l). Réservé aux grands titres — voir la classe
                        `.wonk` dans styles.css.

         L'axe SOFT n'est pas demandé : son effet est subtil et il alourdit le
         fichier pour un gain invisible en dessous de 60 px. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,WONK@9..144,300..900,0..1&display=swap"
    />
    <!-- UNE SEULE FAMILLE, à la demande : tous les écrits du site sont en
         Fraunces. Inter et Plus Jakarta Sans ont été retirées du lien — elles
         n'étaient plus nommées nulle part, et les laisser aurait fait
         télécharger deux familles jamais peintes, sur le chemin critique.
         Les trois sections transférées (« Notre catalogue », « Bienvenue à
         Golden Pousso », la fiche produit) employaient Plus Jakarta Sans pour
         rester conformes à leur modèle : c'est le seul écart au transfert à
         l'identique sur ce point. -->

    <!-- Boxicons -->
    <link rel="preconnect" href="https://unpkg.com" />
    <link href="https://unpkg.com/boxicons@2.0.9/css/boxicons.min.css" rel="stylesheet" />

    <!-- ══ Google Analytics GA4 ═════════════════════════════════════════════
         DÉSACTIVÉ : l'ID était resté sur le gabarit G-XXXXXXXXXX. En l'état le
         site payait un DNS + TLS + téléchargement de gtag.js à chaque visite
         pour n'envoyer les données nulle part.
         Pour réactiver : remplacer les deux G-XXXXXXXXXX par l'ID de mesure
         réel, puis retirer les balises de commentaire ci-dessous.

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-XXXXXXXXXX');
    </script>
    -->

    <!-- Le même titre que celui du repli de SEOHead (accueil) : sans cela,
         l'onglet change de texte au premier rendu de React. -->
    <title>Golden Pousso | Couture Africaine Haut de Gamme</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
