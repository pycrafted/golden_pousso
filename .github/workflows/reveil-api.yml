# Empêche l'API de s'endormir aux heures où la boutique est visitée.
# ---------------------------------------------------------------------------
# Render endort un service gratuit après 15 minutes sans requête, et le réveil
# prend une cinquantaine de secondes. Un client qui tombe sur une page blanche
# pendant ce temps-là est parti.
#
# ── Pourquoi PAS toute la journée ──────────────────────────────────────────
# Le plan gratuit donne 750 heures d'instance par mois, PARTAGÉES entre tous
# les services gratuits de l'espace de travail — et une instance endormie n'en
# consomme aucune. Maintenir un service éveillé 24 h/24 en consomme ~720 : la
# quasi-totalité du quota, après quoi Render suspend tout jusqu'au mois
# suivant. La boutique serait alors hors ligne, pas seulement lente.
#
# On ne réveille donc qu'aux heures d'ouverture : 7 h - 23 h, soit ~480 heures
# par mois. La nuit, le service dort et personne ne le remarque.
#
# Le Sénégal vit à l'heure GMT toute l'année, sans heure d'été : les heures
# ci-dessous sont donc à la fois UTC et locales. Il n'y a rien à décaler.
#
# ⚠ GitHub désactive les tâches planifiées d'un dépôt public après 60 jours
# sans commit. Si l'API se remet à dormir sans raison, c'est la première chose
# à vérifier : onglet Actions, le workflow y apparaît alors comme désactivé.

name: Réveil de l'API

on:
  schedule:
    # Toutes les 10 minutes, de 7 h à 22 h 50 inclus. La veille se déclenche à
    # 15 minutes : 10 laisse de la marge pour les retards de GitHub, qui met
    # parfois plusieurs minutes à lancer une tâche planifiée aux heures de
    # pointe.
    - cron: '*/10 7-22 * * *'
  # Pour réveiller à la demande depuis l'onglet Actions.
  workflow_dispatch:

# Une exécution retardée ne doit pas s'empiler sur la suivante.
concurrency:
  group: reveil-api
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Appeler l'API
        env:
          # Le service qui porte la configuration Cloudflare R2. À changer ici
          # si l'adresse de l'API change — c'est le seul endroit qui la nomme.
          CIBLE: https://golden-pousso-api.onrender.com/api/v1/categories/
        run: |
          # Trois appels espacés couvrent la fenêtre de dix minutes. Si GitHub
          # retarde l'exécution suivante, l'écart reste sous les 15 minutes
          # fatidiques au lieu de laisser le service s'endormir.
          for tour in 1 2 3; do
            echo "── Appel $tour sur 3 ──"
            # --max-time 120 : un réveil à froid prend une cinquantaine de
            # secondes, un délai plus court ferait échouer le premier appel de
            # la journée à chaque fois.
            curl --fail --silent --show-error --max-time 120 \
                 --retry 2 --retry-delay 10 \
                 -o /dev/null -w 'HTTP %{http_code} en %{time_total}s\n' \
                 "$CIBLE"
            # Pas d'attente après le dernier : elle ne servirait qu'à faire
            # tourner le runner pour rien.
            [ "$tour" = 3 ] || sleep 180
          done
